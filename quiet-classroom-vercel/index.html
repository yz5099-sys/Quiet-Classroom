<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#9bdcff" />
  <title>Quiet Classroom 自习静音守护</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #2d3448;
      --panel: rgba(255,255,255,0.76);
      --shadow: 0 24px 80px rgba(79, 96, 130, 0.20);
      --blue: #78d8ff;
      --pink: #ff8fb8;
      --orange: #ffb45e;
    }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 18% 8%, rgba(255, 246, 169, .95) 0, transparent 30%), linear-gradient(180deg, #aee5ff 0%, #fff4bd 52%, #ffd8c2 100%);
      transition: background .8s ease, color .8s ease;
    }
    body.afternoon {
      background: radial-gradient(circle at 80% 4%, rgba(255, 236, 161, .8) 0, transparent 31%), linear-gradient(180deg, #ffc886 0%, #ffaf87 48%, #e991b7 100%);
    }
    body.night {
      color: #f6f1ff;
      background: radial-gradient(circle at 74% 8%, rgba(255,255,215,.18) 0 10%, transparent 23%), linear-gradient(180deg, #101848 0%, #2a2263 48%, #16172f 100%);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 12% 16%, rgba(255,255,255,.55) 0 2px, transparent 3px),
        radial-gradient(circle at 86% 22%, rgba(255,255,255,.35) 0 2px, transparent 3px),
        radial-gradient(circle at 40% 78%, rgba(255,255,255,.28) 0 2px, transparent 3px);
      opacity: .8;
      z-index: 0;
    }
    .app { position: relative; z-index: 1; width: min(1180px, 94vw); margin: 0 auto; padding: 24px 0 36px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    h1 { font-size: clamp(30px, 4vw, 48px); letter-spacing: -0.055em; margin-bottom: 6px; text-shadow: 0 4px 18px rgba(255,255,255,.58); }
    .subtitle { opacity: .78; font-size: 15px; font-weight: 700; }
    .score-card, .panel { background: var(--panel); backdrop-filter: blur(18px); box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,.62); }
    body.night .score-card, body.night .panel { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.13); box-shadow: 0 22px 64px rgba(0,0,0,.26); }
    .score-card { min-width: 190px; padding: 17px 21px; border-radius: 28px; text-align: right; }
    .score-label { font-size: 13px; opacity: .72; font-weight: 800; }
    .score { font-size: 38px; line-height: 1; font-weight: 950; background: linear-gradient(135deg, #39b7ff, #8669ff, #ff7bb7); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .layout { display: grid; grid-template-columns: 1fr 320px; gap: 18px; align-items: stretch; }
    .scene-wrap { position: relative; min-height: 620px; border-radius: 42px; overflow: hidden; background: rgba(255,255,255,.36); box-shadow: 0 30px 90px rgba(80,85,125,.24); border: 1px solid rgba(255,255,255,.56); isolation: isolate; }
    .scene-wrap::before { content: ""; position: absolute; inset: 10px; border-radius: 34px; border: 2px solid rgba(255,255,255,.42); pointer-events: none; z-index: 30; }
    .room { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.1)); }
    .room::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.18) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.13) 1px, transparent 1px); background-size: 58px 58px; mask-image: linear-gradient(to bottom, black 0 58%, transparent 100%); opacity: .55; }
    .window { position: absolute; top: 58px; left: 72px; width: 226px; height: 168px; border-radius: 32px; background: linear-gradient(180deg, #78d8ff, #fff8c6 72%); border: 12px solid rgba(255,255,255,.82); box-shadow: inset 0 0 0 4px rgba(255,255,255,.28), 0 24px 48px rgba(255,190,72,.28); overflow: hidden; }
    .window::before, .window::after { content: ""; position: absolute; background: rgba(255,255,255,.76); z-index: 2; }
    .window::before { width: 10px; height: 100%; left: calc(50% - 5px); }
    .window::after { height: 10px; width: 100%; top: calc(50% - 5px); }
    .cloud { position: absolute; width: 82px; height: 26px; left: 24px; top: 42px; background: rgba(255,255,255,.72); border-radius: 999px; }
    .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
    .cloud::before { width: 36px; height: 36px; left: 16px; top: -18px; }
    .cloud::after { width: 30px; height: 30px; right: 10px; top: -12px; }
    body.afternoon .window { background: linear-gradient(180deg, #ff9364, #ffe29a 56%, #ffbe82); box-shadow: 0 22px 48px rgba(255,112,67,.24); }
    body.night .window { background: radial-gradient(circle at 70% 30%, #fbf4ba 0 15px, transparent 16px), linear-gradient(180deg, #111a55, #35266a); box-shadow: 0 18px 42px rgba(18,20,70,.52); }
    .star { display: none; position: absolute; width: 4px; height: 4px; background: white; border-radius: 50%; opacity: .85; box-shadow: 0 0 8px white; animation: twinkle 2.4s ease-in-out infinite; }
    body.night .star { display: block; }
    body.night .cloud { display: none; }
    .s1 { top: 28px; left: 42px; } .s2 { top: 74px; left: 84px; animation-delay: .4s; } .s3 { top: 48px; left: 150px; animation-delay: .8s; } .s4 { top: 112px; left: 128px; animation-delay: 1.2s; }
    .sun-ray { position: absolute; top: 178px; left: 126px; width: 560px; height: 286px; transform: rotate(17deg); background: linear-gradient(90deg, rgba(255,249,181,.62), rgba(255,255,255,0)); clip-path: polygon(0 18%,100% 0,100% 100%,0 82%); filter: blur(1.4px); pointer-events: none; mix-blend-mode: screen; }
    body.night .sun-ray { display: none; }
    .floor { position: absolute; left: 0; bottom: 0; width: 100%; height: 34%; background: linear-gradient(180deg, rgba(255,255,255,.18), transparent 36%), repeating-linear-gradient(90deg, rgba(130,82,62,.18) 0 24px, rgba(255,255,255,.18) 24px 27px), linear-gradient(180deg, #efbd86, #cc8b65); border-top: 3px solid rgba(255,255,255,.35); }
    body.night .floor { background: repeating-linear-gradient(90deg, rgba(42,35,74,.36) 0 24px, rgba(255,255,255,.04) 24px 27px), linear-gradient(180deg, #51406f, #34264c); }
    .rug { position: absolute; left: 50%; bottom: 36px; width: 560px; height: 90px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255,255,255,.38), rgba(255,196,213,.32) 58%, rgba(255,196,213,0) 70%); z-index: 1; }
    .table { position: absolute; bottom: 118px; left: 50%; transform: translateX(-50%); width: min(560px, 78%); height: 28px; border-radius: 16px; background: linear-gradient(180deg, #c79269, #8c5b46); box-shadow: 0 18px 35px rgba(55,38,49,.2); z-index: 4; }
    .table::before, .table::after { content: ""; position: absolute; top: 26px; width: 24px; height: 120px; border-radius: 0 0 16px 16px; background: linear-gradient(180deg, #9a644b, #6f4538); }
    .table::before { left: 38px; } .table::after { right: 38px; }
    .fish-tank { position: absolute; bottom: 146px; left: 50%; transform: translateX(-50%); width: min(410px, 66%); height: 250px; border-radius: 34px 34px 28px 28px; background: rgba(180,230,255,.24); border: 8px solid rgba(255,255,255,.82); box-shadow: inset 0 0 0 2px rgba(255,255,255,.28), 0 24px 55px rgba(54,98,136,.22); overflow: hidden; z-index: 6; }
    .fish-tank::before { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.55) 0 12%, transparent 13% 28%, rgba(255,255,255,.22) 29% 40%, transparent 41%); z-index: 6; pointer-events: none; }
    .water { position: absolute; inset: 0; background: radial-gradient(circle at 28% 20%, rgba(255,255,255,.42), transparent 28%), linear-gradient(180deg, rgba(142,220,255,.55), rgba(48,154,229,.68)); }
    .water::before { content: ""; position: absolute; left: -40px; right: -40px; top: 24px; height: 22px; background: rgba(255,255,255,.35); border-radius: 50%; animation: waterWave 3s ease-in-out infinite; }
    .plant { position: absolute; bottom: 10px; width: 18px; height: 72px; border-radius: 100% 0 100% 0; background: rgba(37,173,119,.8); transform-origin: bottom; animation: plantSway 2.8s ease-in-out infinite; z-index: 3; }
    .plant.p1 { left: 54px; } .plant.p2 { right: 70px; height: 58px; animation-delay: .7s; }
    .sand { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; background: radial-gradient(circle at 18% 48%, #fff2b6 0 5px, transparent 6px), radial-gradient(circle at 68% 30%, #f7d58b 0 4px, transparent 5px), linear-gradient(180deg, #f6d28d, #d9ad6f); z-index: 2; }
    .fish { position: absolute; left: 172px; bottom: 95px; width: 92px; height: 54px; transform-origin: center; transition: transform .3s ease; z-index: 5; animation: sleepyFloat 3s ease-in-out infinite; }
    .fish-body { position: absolute; left: 0; top: 8px; width: 72px; height: 42px; border-radius: 50% 55% 55% 50%; background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), transparent 18%), linear-gradient(135deg, #ffcf62, #ff8b38); box-shadow: inset -8px -7px 0 rgba(174,83,31,.12); }
    .fish-tail { position: absolute; right: 0; top: 14px; width: 34px; height: 32px; background: linear-gradient(135deg, #ffb84d, #ff7b3b); clip-path: polygon(0 50%, 100% 0, 78% 50%, 100% 100%); transform-origin: left center; animation: tailSleep 1.9s ease-in-out infinite; }
    .fish-eye { position: absolute; left: 18px; top: 24px; width: 13px; height: 7px; border-bottom: 3px solid #5b2b1b; border-radius: 0 0 999px 999px; background: transparent; }
    .fish-mouth { position: absolute; left: 8px; top: 34px; width: 12px; height: 6px; border-bottom: 2px solid rgba(105,53,38,.55); border-radius: 50%; }
    .fish.awake { animation: panicSwim .32s infinite alternate; }
    .fish.awake .fish-eye { top: 22px; width: 8px; height: 8px; border: 0; background: #1f1f1f; border-radius: 50%; box-shadow: 0 0 0 3px white; }
    .fish.awake .fish-tail { animation: tailPanic .12s infinite alternate; }
    .fish-tank .zzz { position: absolute; left: 132px; bottom: 154px; z-index: 8; font-size: 28px; font-weight: 950; color: rgba(255,255,255,.94); text-shadow: 0 3px 10px rgba(45,115,180,.52); animation: floatFishZ 2.2s ease-in-out infinite; pointer-events: none; }
    .fish-tank .zzz.hide { opacity: 0 !important; visibility: hidden; animation: none; transform: scale(.4); }
    .noise-alert { position: absolute; left: 50%; top: 28px; transform: translateX(-50%) translateY(-20px); padding: 12px 18px; border-radius: 999px; background: rgba(255,93,116,.94); color: white; font-weight: 950; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 40; box-shadow: 0 16px 34px rgba(255,93,93,.3); }
    .noise-alert.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .panel { border-radius: 32px; padding: 20px; }
    .panel h2 { font-size: 20px; margin-bottom: 14px; }
    .field { margin-bottom: 14px; }
    label { display: block; margin-bottom: 7px; font-size: 13px; opacity: .76; font-weight: 850; }
    input, select { width: 100%; border: 0; outline: 0; padding: 12px 13px; border-radius: 17px; background: rgba(255,255,255,.86); color: #263238; font-size: 15px; box-shadow: inset 0 0 0 1px rgba(101,117,145,.08); }
    body.night input, body.night select { background: rgba(255,255,255,.16); color: white; } body.night option { color: #111; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
    button { border: 0; cursor: pointer; border-radius: 19px; padding: 13px 14px; font-weight: 950; font-size: 15px; transition: transform .15s ease, opacity .2s ease, box-shadow .2s ease; }
    button:hover { transform: translateY(-1px); } button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .primary { color: white; background: linear-gradient(135deg, #38bdf8, #6d6df8, #b66dff); box-shadow: 0 14px 30px rgba(99,102,241,.28); }
    .danger { color: white; background: linear-gradient(135deg, #fb7185, #f97316); box-shadow: 0 14px 30px rgba(251,113,133,.24); }
    .secondary { color: #334155; background: rgba(255,255,255,.78); }
    .stat-list { display: grid; gap: 10px; margin-top: 14px; }
    .stat { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 12px; border-radius: 17px; background: rgba(255,255,255,.48); font-size: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.28); }
    body.night .stat { background: rgba(255,255,255,.1); }
    .volume-box { margin-top: 16px; }
    .volume-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; opacity: .78; font-weight: 800; }
    .volume-track { height: 14px; background: rgba(255,255,255,.58); border-radius: 999px; overflow: hidden; box-shadow: inset 0 1px 5px rgba(0,0,0,.08); }
    .volume-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #55e6a5, #facc15, #ff6685); border-radius: 999px; transition: width .08s linear; }
    .hint { font-size: 13px; line-height: 1.6; opacity: .72; margin-top: 14px; }
    .status-pill { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(34,197,94,.14); font-weight: 950; font-size: 13px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,.12); }
    .status-pill.noisy { background: rgba(239,68,68,.18); } .status-pill.noisy .dot { background: #ef4444; box-shadow: 0 0 0 4px rgba(239,68,68,.12); }
    .modal { position: fixed; inset: 0; display: none; place-items: center; padding: 20px; background: rgba(15,23,42,.54); z-index: 100; }
    .modal.show { display: grid; }
    .result-card { width: min(460px, 92vw); padding: 28px; border-radius: 32px; background: rgba(255,255,255,.94); color: #263238; box-shadow: 0 28px 90px rgba(0,0,0,.24); text-align: center; border: 1px solid rgba(255,255,255,.6); }
    .badge { display: inline-block; margin: 12px 0 18px; padding: 10px 18px; border-radius: 999px; background: linear-gradient(135deg, #facc15, #fb7185, #8b5cf6); color: white; font-weight: 950; font-size: 18px; box-shadow: 0 12px 28px rgba(251,113,133,.25); }
    .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 22px; }
    .result-item { padding: 14px 10px; border-radius: 18px; background: #f4f7fb; } .result-item strong { display: block; font-size: 22px; margin-bottom: 3px; }
    @keyframes sleepyFloat { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(5px) rotate(1deg); } }
    @keyframes tailSleep { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @keyframes panicSwim { 0% { transform: translate(-48px,-28px) rotate(-18deg); } 25% { transform: translate(62px,14px) rotate(20deg); } 50% { transform: translate(-28px,42px) rotate(-25deg); } 75% { transform: translate(50px,-24px) rotate(18deg); } 100% { transform: translate(-14px,12px) rotate(-12deg); } }
    @keyframes tailPanic { from { transform: scaleX(1) rotate(-14deg); } to { transform: scaleX(1.42) rotate(14deg); } }
    @keyframes floatFishZ { 0% { opacity: 0; transform: translateY(10px) scale(.85); } 35% { opacity: .95; } 100% { opacity: 0; transform: translateY(-24px) scale(1.18); } }
    @keyframes waterWave { 0%,100% { transform: translateX(-16px); } 50% { transform: translateX(16px); } }
    @keyframes plantSway { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(7deg); } }
    @keyframes twinkle { 0%,100% { opacity: .45; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.3); } }
    @media (max-width: 900px) { header { align-items: flex-start; flex-direction: column; } .score-card { width: 100%; text-align: left; } .layout { grid-template-columns: 1fr; } .scene-wrap { min-height: 560px; } }
    @media (max-width: 520px) { .app { width: 96vw; padding-top: 16px; } .scene-wrap { min-height: 500px; border-radius: 28px; } .window { left: 28px; top: 48px; width: 165px; height: 126px; } .fish-tank { width: 310px; height: 210px; bottom: 150px; } .fish { left: 120px; } .fish-tank .zzz { left: 88px; bottom: 140px; } .table { width: 340px; } .buttons { grid-template-columns: 1fr; } .result-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Quiet Classroom</h1>
        <p class="subtitle">让教室安静一点，小鱼才能安心睡觉。</p>
      </div>
      <div class="score-card">
        <div class="score-label">当前分数</div>
        <div class="score" id="score">0</div>
      </div>
    </header>
    <main class="layout">
      <section class="scene-wrap">
        <div class="room">
          <div class="window">
            <span class="cloud"></span><span class="star s1"></span><span class="star s2"></span><span class="star s3"></span><span class="star s4"></span>
          </div>
          <div class="sun-ray"></div>
          <div class="floor"></div><div class="rug"></div>
          <div class="table"></div>
          <div class="fish-tank">
            <div class="water"></div>
            <div class="plant p1"></div><div class="plant p2"></div><div class="sand"></div>
            <div class="fish" id="fish">
              <div class="fish-body"></div><div class="fish-tail"></div><div class="fish-eye"></div><div class="fish-mouth"></div>
            </div>
            <div class="zzz" id="zzz">Zzz</div>
          </div>
        </div>
        <div class="noise-alert" id="noiseAlert">太吵啦！小鱼被吵醒了</div>
      </section>
      <aside class="panel">
        <h2>自习控制台</h2>
        <div class="field"><label for="mode">模式</label><select id="mode"><option value="manual">手动开始 / 结束</option><option value="duration">按持续时长</option><option value="scheduled">按开始和结束时间</option></select></div>
        <div class="field" id="durationField"><label for="duration">持续时长（分钟）</label><input id="duration" type="number" min="1" value="10" /></div>
        <div class="field" id="scheduleFields" style="display:none;"><label for="startTime">开始时间</label><input id="startTime" type="time" /><label for="endTime" style="margin-top:10px;">结束时间</label><input id="endTime" type="time" /></div>
        <div class="field"><label for="threshold">噪音阈值：<span id="thresholdText">38</span>%</label><input id="threshold" type="range" min="10" max="90" value="38" /></div>
        <div class="buttons"><button class="primary" id="startBtn">开始自习</button><button class="danger" id="stopBtn" disabled>结束</button><button class="secondary" id="testNoiseBtn">测试惊醒</button><button class="secondary" id="resetBtn">重置</button></div>
        <div class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">等待开始</span></div>
        <div class="volume-box"><div class="volume-label"><span>环境音量</span><span id="volumeText">0%</span></div><div class="volume-track"><div class="volume-bar" id="volumeBar"></div></div></div>
        <div class="stat-list">
          <div class="stat"><span>本机时间</span><strong id="localClock">--:--:--</strong></div>
          <div class="stat"><span>剩余时间</span><strong id="timeLeft">--:--</strong></div>
          <div class="stat"><span>安静时长</span><strong id="quietTime">0s</strong></div>
          <div class="stat"><span>连续安静最长</span><strong id="longestQuiet">0s</strong></div>
          <div class="stat"><span>惊醒次数</span><strong id="noiseEvents">0</strong></div>
        </div>
        <p class="hint">部署到 Vercel 后会自动使用 HTTPS，浏览器会正常弹出麦克风权限。若拒绝权限，系统会进入预览模式，仍可测试界面和计分。</p>
      </aside>
    </main>
  </div>
  <div class="modal" id="resultModal"><div class="result-card"><h2>自习结束</h2><p>本轮安静挑战结果如下：</p><div class="badge" id="titleBadge">安静守护者</div><div class="result-grid"><div class="result-item"><strong id="finalScore">0</strong><span>总分</span></div><div class="result-item"><strong id="finalQuiet">0s</strong><span>安静时长</span></div><div class="result-item"><strong id="finalLongest">0s</strong><span>最长连续安静</span></div><div class="result-item"><strong id="finalNoise">0</strong><span>惊醒次数</span></div></div><button class="primary" id="closeModalBtn">完成</button></div></div>
  <script>
    const $ = (id) => document.getElementById(id);
    const state = { running:false, score:0, quietSeconds:0, currentQuietStreak:0, longestQuietStreak:0, noiseEvents:0, lastTick:null, endAt:null, audioContext:null, analyser:null, source:null, stream:null, animationFrame:null, noiseCooldownUntil:0, overThresholdSince:null, volume:0, scheduledTimer:null, audioReady:false, previewMode:false };
    const elements = {
      score:$("score"), mode:$("mode"), duration:$("duration"), durationField:$("durationField"), scheduleFields:$("scheduleFields"), startTime:$("startTime"), endTime:$("endTime"), threshold:$("threshold"), thresholdText:$("thresholdText"), startBtn:$("startBtn"), stopBtn:$("stopBtn"), resetBtn:$("resetBtn"), testNoiseBtn:$("testNoiseBtn"), statusPill:$("statusPill"), statusText:$("statusText"), volumeText:$("volumeText"), volumeBar:$("volumeBar"), timeLeft:$("timeLeft"), quietTime:$("quietTime"), longestQuiet:$("longestQuiet"), noiseEvents:$("noiseEvents"), fish:$("fish"), zzz:$("zzz"), noiseAlert:$("noiseAlert"), resultModal:$("resultModal"), finalScore:$("finalScore"), finalQuiet:$("finalQuiet"), finalLongest:$("finalLongest"), finalNoise:$("finalNoise"), titleBadge:$("titleBadge"), closeModalBtn:$("closeModalBtn")
    };
    function applyTimeTheme(){ const now=new Date(); const hour=now.getHours(); document.body.classList.remove("morning","afternoon","night"); if(hour>=6&&hour<12) document.body.classList.add("morning"); else if(hour>=12&&hour<18) document.body.classList.add("afternoon"); else document.body.classList.add("night"); const clock=$("localClock"); if(clock) clock.textContent=now.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}); }
    function formatTime(seconds){ if(!Number.isFinite(seconds)||seconds<0) seconds=0; const m=Math.floor(seconds/60); const s=Math.floor(seconds%60); return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`; }
    function formatSeconds(seconds){ seconds=Math.floor(seconds); if(seconds<60) return `${seconds}s`; return `${Math.floor(seconds/60)}m ${seconds%60}s`; }
    function getTodayTime(timeString){ const [hour,minute]=timeString.split(":").map(Number); const date=new Date(); date.setHours(hour,minute,0,0); return date; }
    function setStatus(text,noisy){ elements.statusText.textContent=text; elements.statusPill.classList.toggle("noisy",Boolean(noisy)); }
    function computeEndAt(){ const mode=elements.mode.value; const now=new Date(); if(mode==="manual") return null; if(mode==="duration"){ const minutes=Math.max(1,Number(elements.duration.value||10)); return new Date(now.getTime()+minutes*60*1000); } if(mode==="scheduled"){ if(!elements.startTime.value||!elements.endTime.value){ alert("请先设置开始时间和结束时间。"); return false; } let startAt=getTodayTime(elements.startTime.value); let endAt=getTodayTime(elements.endTime.value); if(endAt<=startAt) endAt.setDate(endAt.getDate()+1); if(now<startAt){ const diff=Math.ceil((startAt-now)/1000); setStatus(`已预约，${formatTime(diff)} 后开始`,false); elements.startBtn.disabled=true; state.scheduledTimer=setTimeout(()=>startSession(true),diff*1000); return "scheduled"; } return endAt; } return null; }
    async function setupAudio(){ if(state.audioContext&&state.audioReady) return true; const canUseMic=Boolean(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia); if(!canUseMic){ state.previewMode=true; state.audioReady=false; setStatus("预览模式：无法访问麦克风",false); return false; } try{ state.stream=await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false }}); state.audioContext=new (window.AudioContext||window.webkitAudioContext)(); if(state.audioContext.state==="suspended") await state.audioContext.resume(); state.analyser=state.audioContext.createAnalyser(); state.analyser.fftSize=1024; state.source=state.audioContext.createMediaStreamSource(state.stream); state.source.connect(state.analyser); state.audioReady=true; state.previewMode=false; return true; }catch(error){ console.warn("麦克风不可用，已进入预览模式：",error); state.previewMode=true; state.audioReady=false; setStatus("预览模式：麦克风未授权",false); return false; } }
    function startAudioLoop(){ if(!state.audioReady||!state.analyser){ startPreviewAudioLoop(); return; } const buffer=new Uint8Array(state.analyser.fftSize); function loop(){ if(!state.running) return; state.analyser.getByteTimeDomainData(buffer); let sum=0; for(let i=0;i<buffer.length;i++){ const centered=(buffer[i]-128)/128; sum+=centered*centered; } const rms=Math.sqrt(sum/buffer.length); const volume=Math.min(100,Math.round(rms*520)); state.volume=volume; updateVolumeUI(volume); checkNoise(volume); state.animationFrame=requestAnimationFrame(loop); } loop(); }
    function startPreviewAudioLoop(){ function loop(){ if(!state.running||!state.previewMode) return; const fakeVolume=Math.max(0,Math.round(8+Math.sin(Date.now()/900)*4)); state.volume=fakeVolume; updateVolumeUI(fakeVolume); setStatus("预览模式运行中",false); state.animationFrame=requestAnimationFrame(loop); } loop(); }
    function updateVolumeUI(volume){ elements.volumeText.textContent=`${volume}%`; elements.volumeBar.style.width=`${volume}%`; }
    function checkNoise(volume){ const threshold=Number(elements.threshold.value); const now=Date.now(); if(volume>=threshold){ if(!state.overThresholdSince) state.overThresholdSince=now; const durationOver=now-state.overThresholdSince; setStatus("检测到较大声音",true); if(durationOver>300&&now>state.noiseCooldownUntil){ triggerNoiseEvent(); state.noiseCooldownUntil=now+1400; state.overThresholdSince=null; } } else { state.overThresholdSince=null; if(state.running) setStatus(state.previewMode?"预览模式运行中":"安静守护中",false); } }
    function triggerNoiseEvent(){ state.noiseEvents+=1; state.score=Math.max(0,state.score-25); state.currentQuietStreak=0; elements.fish.classList.add("awake"); elements.zzz.classList.add("hide"); elements.noiseAlert.classList.add("show"); setTimeout(()=>{ elements.fish.classList.remove("awake"); elements.zzz.classList.remove("hide"); elements.noiseAlert.classList.remove("show"); },1400); renderStats(); }
    async function startSession(fromSchedule=false){ if(state.running) return; if(state.scheduledTimer&&!fromSchedule){ clearTimeout(state.scheduledTimer); state.scheduledTimer=null; } const endAt=fromSchedule&&elements.mode.value==="scheduled" ? (()=>{ let end=getTodayTime(elements.endTime.value); if(end<=new Date()) end.setDate(end.getDate()+1); return end; })() : computeEndAt(); if(endAt===false||endAt==="scheduled") return; await setupAudio(); resetSessionData(false); state.running=true; state.lastTick=Date.now(); state.endAt=endAt; elements.startBtn.disabled=true; elements.stopBtn.disabled=false; elements.mode.disabled=true; setStatus(state.previewMode?"预览模式运行中":"安静守护中",false); startAudioLoop(); startScoreLoop(); renderStats(); }
    function startScoreLoop(){ function tick(){ if(!state.running) return; const now=Date.now(); const delta=(now-state.lastTick)/1000; state.lastTick=now; const isQuiet=state.volume<Number(elements.threshold.value)*.9; if(isQuiet){ state.quietSeconds+=delta; state.currentQuietStreak+=delta; state.longestQuietStreak=Math.max(state.longestQuietStreak,state.currentQuietStreak); const growth=1+Math.min(8,Math.pow(state.currentQuietStreak/20,1.35)); state.score+=growth*delta; } if(state.endAt&&now>=state.endAt.getTime()){ stopSession(true); return; } renderStats(); setTimeout(tick,500); } tick(); }
    function stopSession(showResult=true){ if(!state.running&&showResult) return; state.running=false; elements.startBtn.disabled=false; elements.stopBtn.disabled=true; elements.mode.disabled=false; state.endAt=null; state.overThresholdSince=null; if(state.animationFrame) cancelAnimationFrame(state.animationFrame); setStatus("已结束",false); updateVolumeUI(0); if(showResult) showResultModal(); }
    function resetSessionData(updateUI=true){ state.score=0; state.quietSeconds=0; state.currentQuietStreak=0; state.longestQuietStreak=0; state.noiseEvents=0; state.volume=0; state.lastTick=null; state.endAt=null; if(updateUI) renderStats(); }
    function resetAll(){ if(state.scheduledTimer){ clearTimeout(state.scheduledTimer); state.scheduledTimer=null; } stopSession(false); resetSessionData(true); setStatus("等待开始",false); elements.startBtn.disabled=false; elements.stopBtn.disabled=true; elements.mode.disabled=false; updateVolumeUI(0); }
    function renderStats(){ elements.score.textContent=Math.floor(state.score); elements.quietTime.textContent=formatSeconds(state.quietSeconds); elements.longestQuiet.textContent=formatSeconds(state.longestQuietStreak); elements.noiseEvents.textContent=state.noiseEvents; if(state.endAt&&state.running){ const left=Math.max(0,Math.ceil((state.endAt.getTime()-Date.now())/1000)); elements.timeLeft.textContent=formatTime(left); } else { elements.timeLeft.textContent=state.running?"手动模式":"--:--"; } }
    function getHonorTitle(score,noiseEvents){ if(score>=800&&noiseEvents<=1) return "静音之神"; if(score>=500) return "自习大师"; if(score>=220) return "安静守护者"; if(score>=80) return "安静小队"; return "继续加油"; }
    function showResultModal(){ const finalScore=Math.floor(state.score); elements.finalScore.textContent=finalScore; elements.finalQuiet.textContent=formatSeconds(state.quietSeconds); elements.finalLongest.textContent=formatSeconds(state.longestQuietStreak); elements.finalNoise.textContent=state.noiseEvents; elements.titleBadge.textContent=getHonorTitle(finalScore,state.noiseEvents); elements.resultModal.classList.add("show"); }
    elements.mode.addEventListener("change",()=>{ const mode=elements.mode.value; elements.durationField.style.display=mode==="duration"?"block":"none"; elements.scheduleFields.style.display=mode==="scheduled"?"block":"none"; });
    elements.threshold.addEventListener("input",()=>{ elements.thresholdText.textContent=elements.threshold.value; });
    elements.startBtn.addEventListener("click",()=>startSession()); elements.stopBtn.addEventListener("click",()=>stopSession(true)); elements.resetBtn.addEventListener("click",resetAll); elements.testNoiseBtn.addEventListener("click",()=>triggerNoiseEvent()); elements.closeModalBtn.addEventListener("click",()=>{ elements.resultModal.classList.remove("show"); resetAll(); });
    applyTimeTheme(); setInterval(applyTimeTheme,1000); elements.mode.dispatchEvent(new Event("change")); renderStats();
  </script>
</body>

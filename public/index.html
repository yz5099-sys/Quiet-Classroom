<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiet Classroom 自习静音守护</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body{min-height:100vh;color:#2d3448;background:linear-gradient(180deg,#aee5ff,#fff4bd 55%,#ffd8c2);transition:.5s}.night{color:#f6f1ff;background:linear-gradient(180deg,#101848,#2a2263 48%,#16172f)}.afternoon{background:linear-gradient(180deg,#ffc886,#ffaf87 48%,#e991b7)}.app{width:min(1180px,94vw);margin:auto;padding:24px 0 36px}header{display:flex;justify-content:space-between;gap:16px;margin-bottom:18px;align-items:center}h1{font-size:clamp(30px,4vw,48px)}p{opacity:.78}.score-card,.panel{background:rgba(255,255,255,.72);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.58);box-shadow:0 24px 80px rgba(79,96,130,.2);border-radius:28px}.score-card{min-width:190px;padding:17px 21px;text-align:right}.score{font-size:38px;font-weight:900;background:linear-gradient(135deg,#39b7ff,#8669ff,#ff7bb7);background-clip:text;-webkit-background-clip:text;color:transparent}.layout{display:grid;grid-template-columns:1fr 320px;gap:18px}.scene-wrap{position:relative;min-height:620px;border-radius:42px;overflow:hidden;background:rgba(255,255,255,.36);box-shadow:0 30px 90px rgba(80,85,125,.24);border:1px solid rgba(255,255,255,.56)}.room{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.1))}.room:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.13) 1px,transparent 1px);background-size:58px 58px;opacity:.55}.window{position:absolute;top:58px;left:72px;width:226px;height:168px;border-radius:32px;background:linear-gradient(180deg,#78d8ff,#fff8c6 72%);border:12px solid rgba(255,255,255,.82);box-shadow:0 24px 48px rgba(255,190,72,.28);overflow:hidden}.window:before,.window:after{content:"";position:absolute;background:rgba(255,255,255,.76);z-index:2}.window:before{width:10px;height:100%;left:calc(50% - 5px)}.window:after{height:10px;width:100%;top:calc(50% - 5px)}.night .window{background:radial-gradient(circle at 70% 30%,#fbf4ba 0 15px,transparent 16px),linear-gradient(180deg,#111a55,#35266a)}.afternoon .window{background:linear-gradient(180deg,#ff9364,#ffe29a 56%,#ffbe82)}.cloud{position:absolute;width:82px;height:26px;left:24px;top:42px;background:rgba(255,255,255,.72);border-radius:999px}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:36px;height:36px;left:16px;top:-18px}.cloud:after{width:30px;height:30px;right:10px;top:-12px}.star{display:none;position:absolute;width:4px;height:4px;background:white;border-radius:50%;box-shadow:0 0 8px white;animation:twinkle 2.4s infinite}.night .star{display:block}.night .cloud{display:none}.s1{top:28px;left:42px}.s2{top:74px;left:84px}.s3{top:48px;left:150px}.s4{top:112px;left:128px}.sun-ray{position:absolute;top:178px;left:126px;width:560px;height:286px;transform:rotate(17deg);background:linear-gradient(90deg,rgba(255,249,181,.62),rgba(255,255,255,0));clip-path:polygon(0 18%,100% 0,100% 100%,0 82%);filter:blur(1.4px)}.night .sun-ray{display:none}.floor{position:absolute;left:0;bottom:0;width:100%;height:34%;background:repeating-linear-gradient(90deg,rgba(130,82,62,.18) 0 24px,rgba(255,255,255,.18) 24px 27px),linear-gradient(180deg,#efbd86,#cc8b65);border-top:3px solid rgba(255,255,255,.35)}.table{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);width:430px;height:24px;background:linear-gradient(180deg,#c8926f,#8f604a);border-radius:14px;box-shadow:0 16px 35px rgba(0,0,0,.18);z-index:3}.table:before,.table:after{content:"";position:absolute;top:18px;width:34px;height:150px;background:linear-gradient(180deg,#8a5a44,#704433);border-radius:0 0 12px 12px}.table:before{left:48px}.table:after{right:48px}.fish-tank{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);width:260px;height:170px;border-radius:28px;background:rgba(180,230,255,.35);border:5px solid rgba(255,255,255,.85);box-shadow:inset 0 0 30px rgba(255,255,255,.35),0 18px 45px rgba(54,104,150,.18);overflow:hidden;z-index:4}.water{position:absolute;inset:0;background:linear-gradient(180deg,rgba(145,220,255,.42),rgba(50,150,255,.62))}.water:before{content:"";position:absolute;left:-40px;right:-40px;top:18px;height:24px;background:rgba(255,255,255,.35);border-radius:50%;animation:water 3s ease-in-out infinite}.fish{position:absolute;bottom:56px;left:112px;width:58px;height:34px;transition:.3s}.fish-body{position:absolute;width:58px;height:34px;background:linear-gradient(145deg,#ffbd42,#ff7a1a);border-radius:50%;box-shadow:inset -8px -5px rgba(156,68,12,.16)}.fish-tail{position:absolute;right:-18px;top:7px;width:0;height:0;border-left:22px solid #ff8a1c;border-top:10px solid transparent;border-bottom:10px solid transparent;transform-origin:left center}.fish-eye{position:absolute;left:12px;top:12px;width:12px;height:6px;border-bottom:3px solid #5b2b1b;border-radius:0 0 999px 999px}.fish.awake{animation:panicSwim .32s infinite alternate}.fish.awake .fish-eye{top:10px;width:7px;height:7px;border:0;background:black;border-radius:50%}.fish.awake .fish-tail{animation:tailPanic .12s infinite alternate}.zzz{position:absolute;left:88px;bottom:112px;z-index:6;font-size:28px;font-weight:900;color:rgba(255,255,255,.95);text-shadow:0 2px 8px rgba(45,115,180,.45);animation:floatFishZ 2.2s ease-in-out infinite;pointer-events:none}.zzz.hide{opacity:0!important;visibility:hidden;animation:none}.noise-alert{position:absolute;left:50%;top:28px;transform:translateX(-50%) translateY(-20px);padding:12px 18px;border-radius:999px;background:rgba(255,93,116,.94);color:#fff;font-weight:900;opacity:0;transition:.25s;z-index:40}.noise-alert.show{opacity:1;transform:translateX(-50%) translateY(0)}.panel{padding:20px}h2{font-size:20px;margin-bottom:14px}.field{margin-bottom:14px}.field label{display:block;margin-bottom:7px;font-size:13px;opacity:.76;font-weight:800}input,select{width:100%;border:0;outline:0;padding:12px 13px;border-radius:17px;background:rgba(255,255,255,.86);font-size:15px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}button{border:0;cursor:pointer;border-radius:19px;padding:13px 14px;font-weight:900;font-size:15px}.primary{color:#fff;background:linear-gradient(135deg,#38bdf8,#6d6df8,#b66dff)}.danger{color:#fff;background:linear-gradient(135deg,#fb7185,#f97316)}.secondary{color:#334155;background:rgba(255,255,255,.78)}button:disabled{opacity:.45;cursor:not-allowed}.stat-list{display:grid;gap:10px;margin-top:14px}.stat{display:flex;justify-content:space-between;padding:11px 12px;border-radius:17px;background:rgba(255,255,255,.48);font-size:14px}.volume-box{margin-top:16px}.volume-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;font-weight:700}.volume-track{height:14px;background:rgba(255,255,255,.58);border-radius:999px;overflow:hidden}.volume-bar{height:100%;width:0;background:linear-gradient(90deg,#55e6a5,#facc15,#ff6685);border-radius:999px}.status-pill{display:inline-flex;gap:8px;align-items:center;margin-top:8px;padding:8px 12px;border-radius:999px;background:rgba(34,197,94,.14);font-weight:900;font-size:13px}.status-pill.noisy{background:rgba(239,68,68,.18)}.dot{width:10px;height:10px;border-radius:50%;background:#22c55e}.noisy .dot{background:#ef4444}.hint{font-size:13px;line-height:1.6;opacity:.72;margin-top:14px}.modal{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:rgba(15,23,42,.54);z-index:100}.modal.show{display:grid}.result-card{width:min(460px,92vw);padding:28px;border-radius:32px;background:rgba(255,255,255,.94);color:#263238;box-shadow:0 28px 90px rgba(0,0,0,.24);text-align:center}.badge{display:inline-block;margin:12px 0 18px;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,#facc15,#fb7185,#8b5cf6);color:#fff;font-weight:900;font-size:18px}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 22px}.result-item{padding:14px 10px;border-radius:18px;background:#f4f7fb}.result-item strong{display:block;font-size:22px}@keyframes panicSwim{0%{transform:translate(-28px,-18px) rotate(-16deg)}25%{transform:translate(34px,10px) rotate(18deg)}50%{transform:translate(-18px,22px) rotate(-22deg)}75%{transform:translate(28px,-14px) rotate(16deg)}100%{transform:translate(-8px,8px) rotate(-12deg)}}@keyframes tailPanic{from{transform:scaleX(1) rotate(-8deg)}to{transform:scaleX(1.35) rotate(8deg)}}@keyframes floatFishZ{0%{opacity:0;transform:translateY(10px) scale(.85)}35%{opacity:.95}100%{opacity:0;transform:translateY(-22px) scale(1.18)}}@keyframes water{0%,100%{transform:translateX(-10px)}50%{transform:translateX(10px)}}@keyframes twinkle{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}@media(max-width:900px){header{align-items:flex-start;flex-direction:column}.score-card{width:100%;text-align:left}.layout{grid-template-columns:1fr}.scene-wrap{min-height:560px}}@media(max-width:520px){.app{width:96vw;padding-top:16px}.scene-wrap{min-height:500px}.window{left:28px;top:48px;width:165px;height:126px}.table{width:300px}.fish-tank{width:220px;height:150px}.buttons{grid-template-columns:1fr}.result-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app"><header><div><h1>Quiet Classroom</h1><p>让教室安静一点，小鱼才能安心睡觉。</p></div><div class="score-card"><div>当前分数</div><div class="score" id="score">0</div></div></header><main class="layout"><section class="scene-wrap"><div class="room"><div class="window"><span class="cloud"></span><span class="star s1"></span><span class="star s2"></span><span class="star s3"></span><span class="star s4"></span></div><div class="sun-ray"></div><div class="floor"></div><div class="table"></div><div class="fish-tank"><div class="water"></div><div class="fish" id="fish"><div class="fish-body"></div><div class="fish-tail"></div><div class="fish-eye"></div></div><div class="zzz" id="zzz">Zzz</div></div></div><div class="noise-alert" id="noiseAlert">太吵啦！小鱼被吵醒了</div></section><aside class="panel"><h2>自习控制台</h2><div class="field"><label for="mode">模式</label><select id="mode"><option value="manual">手动开始 / 结束</option><option value="duration">按持续时长</option><option value="scheduled">按开始和结束时间</option></select></div><div class="field" id="durationField"><label for="duration">持续时长（分钟）</label><input id="duration" type="number" min="1" value="10"></div><div class="field" id="scheduleFields" style="display:none"><label for="startTime">开始时间</label><input id="startTime" type="time"><label for="endTime" style="margin-top:10px">结束时间</label><input id="endTime" type="time"></div><div class="field"><label for="threshold">噪音阈值：<span id="thresholdText">38</span>%</label><input id="threshold" type="range" min="10" max="90" value="38"></div><div class="buttons"><button class="primary" id="startBtn">开始自习</button><button class="danger" id="stopBtn" disabled>结束</button><button class="secondary" id="resetBtn">重置</button></div><div class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">等待开始</span></div><div class="volume-box"><div class="volume-label"><span>环境音量</span><span id="volumeText">0%</span></div><div class="volume-track"><div class="volume-bar" id="volumeBar"></div></div></div><div class="stat-list"><div class="stat"><span>本机时间</span><strong id="localClock">--:--:--</strong></div><div class="stat"><span>剩余时间</span><strong id="timeLeft">--:--</strong></div><div class="stat"><span>安静时长</span><strong id="quietTime">0s</strong></div><div class="stat"><span>连续安静最长</span><strong id="longestQuiet">0s</strong></div><div class="stat"><span>惊醒次数</span><strong id="noiseEvents">0</strong></div></div><p class="hint">首次使用需要允许麦克风权限。部署到 Vercel 后是 HTTPS，麦克风权限更稳定。</p></aside></main></div><div class="modal" id="resultModal"><div class="result-card"><h2>自习结束</h2><p>本轮安静挑战结果如下：</p><div class="badge" id="titleBadge">安静守护者</div><div class="result-grid"><div class="result-item"><strong id="finalScore">0</strong><span>总分</span></div><div class="result-item"><strong id="finalQuiet">0s</strong><span>安静时长</span></div><div class="result-item"><strong id="finalLongest">0s</strong><span>最长连续安静</span></div><div class="result-item"><strong id="finalNoise">0</strong><span>惊醒次数</span></div></div><button class="primary" id="closeModalBtn">完成</button></div></div>
  <script>
const $=id=>document.getElementById(id);const state={running:false,score:0,quietSeconds:0,currentQuietStreak:0,longestQuietStreak:0,noiseEvents:0,lastTick:null,endAt:null,audioContext:null,analyser:null,source:null,stream:null,animationFrame:null,noiseCooldownUntil:0,overThresholdSince:null,volume:0,scheduledTimer:null,audioReady:false,previewMode:false};const elements={score:$('score'),mode:$('mode'),duration:$('duration'),durationField:$('durationField'),scheduleFields:$('scheduleFields'),startTime:$('startTime'),endTime:$('endTime'),threshold:$('threshold'),thresholdText:$('thresholdText'),startBtn:$('startBtn'),stopBtn:$('stopBtn'),resetBtn:$('resetBtn'),statusPill:$('statusPill'),statusText:$('statusText'),volumeText:$('volumeText'),volumeBar:$('volumeBar'),timeLeft:$('timeLeft'),quietTime:$('quietTime'),longestQuiet:$('longestQuiet'),noiseEvents:$('noiseEvents'),fish:$('fish'),zzz:$('zzz'),noiseAlert:$('noiseAlert'),resultModal:$('resultModal'),finalScore:$('finalScore'),finalQuiet:$('finalQuiet'),finalLongest:$('finalLongest'),finalNoise:$('finalNoise'),titleBadge:$('titleBadge'),closeModalBtn:$('closeModalBtn')};function applyTimeTheme(){const now=new Date(),h=now.getHours();document.body.classList.remove('morning','afternoon','night');if(h>=6&&h<12)document.body.classList.add('morning');else if(h>=12&&h<18)document.body.classList.add('afternoon');else document.body.classList.add('night');$('localClock').textContent=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}function formatTime(sec){sec=Math.max(0,Math.floor(sec||0));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}function formatSeconds(sec){sec=Math.floor(sec||0);return sec<60?`${sec}s`:`${Math.floor(sec/60)}m ${sec%60}s`}function getTodayTime(t){const[a,b]=t.split(':').map(Number),d=new Date;d.setHours(a,b,0,0);return d}function computeEndAt(){const mode=elements.mode.value,now=new Date;if(mode==='manual')return null;if(mode==='duration')return new Date(now.getTime()+Math.max(1,Number(elements.duration.value||10))*60000);if(mode==='scheduled'){if(!elements.startTime.value||!elements.endTime.value){alert('请先设置开始时间和结束时间。');return false}let s=getTodayTime(elements.startTime.value),e=getTodayTime(elements.endTime.value);if(e<=s)e.setDate(e.getDate()+1);if(now<s){const diff=Math.ceil((s-now)/1000);setStatus(`已预约，${formatTime(diff)} 后开始`,false);elements.startBtn.disabled=true;state.scheduledTimer=setTimeout(()=>startSession(true),diff*1000);return 'scheduled'}return e}return null}function setStatus(t,noisy){elements.statusText.textContent=t;elements.statusPill.classList.toggle('noisy',!!noisy)}async function setupAudio(){if(state.audioContext&&state.audioReady)return true;if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){state.previewMode=true;state.audioReady=false;setStatus('预览模式：无法访问麦克风',false);return false}try{state.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});state.audioContext=new(window.AudioContext||window.webkitAudioContext)();if(state.audioContext.state==='suspended')await state.audioContext.resume();state.analyser=state.audioContext.createAnalyser();state.analyser.fftSize=1024;state.source=state.audioContext.createMediaStreamSource(state.stream);state.source.connect(state.analyser);state.audioReady=true;state.previewMode=false;return true}catch(e){console.warn(e);state.previewMode=true;state.audioReady=false;setStatus('预览模式：麦克风未授权',false);return false}}function startAudioLoop(){if(!state.audioReady||!state.analyser){startPreviewAudioLoop();return}const buffer=new Uint8Array(state.analyser.fftSize);function loop(){if(!state.running)return;state.analyser.getByteTimeDomainData(buffer);let sum=0;for(let i=0;i<buffer.length;i++){const c=(buffer[i]-128)/128;sum+=c*c}const volume=Math.min(100,Math.round(Math.sqrt(sum/buffer.length)*520));state.volume=volume;updateVolumeUI(volume);checkNoise(volume);state.animationFrame=requestAnimationFrame(loop)}loop()}function startPreviewAudioLoop(){function loop(){if(!state.running||!state.previewMode)return;const fake=Math.max(0,Math.round(8+Math.sin(Date.now()/900)*4));state.volume=fake;updateVolumeUI(fake);setStatus('预览模式运行中',false);state.animationFrame=requestAnimationFrame(loop)}loop()}function updateVolumeUI(v){elements.volumeText.textContent=`${v}%`;elements.volumeBar.style.width=`${v}%`}function checkNoise(v){const th=Number(elements.threshold.value),now=Date.now();if(v>=th){if(!state.overThresholdSince)state.overThresholdSince=now;setStatus('检测到较大声音',true);if(now-state.overThresholdSince>300&&now>state.noiseCooldownUntil){triggerNoiseEvent();state.noiseCooldownUntil=now+1400;state.overThresholdSince=null}}else{state.overThresholdSince=null;if(state.running)setStatus(state.previewMode?'预览模式运行中':'安静守护中',false)}}function triggerNoiseEvent(){state.noiseEvents++;state.score=Math.max(0,state.score-25);state.currentQuietStreak=0;elements.fish.classList.add('awake');elements.zzz.classList.add('hide');elements.noiseAlert.classList.add('show');setTimeout(()=>{elements.fish.classList.remove('awake');elements.zzz.classList.remove('hide');elements.noiseAlert.classList.remove('show')},1400);renderStats()}async function startSession(fromSchedule=false){if(state.running)return;if(state.scheduledTimer&&!fromSchedule){clearTimeout(state.scheduledTimer);state.scheduledTimer=null}const endAt=fromSchedule&&elements.mode.value==='scheduled'?(()=>{let e=getTodayTime(elements.endTime.value);if(e<=new Date)e.setDate(e.getDate()+1);return e})():computeEndAt();if(endAt===false||endAt==='scheduled')return;await setupAudio();resetSessionData(false);state.running=true;state.lastTick=Date.now();state.endAt=endAt;elements.startBtn.disabled=true;elements.stopBtn.disabled=false;elements.mode.disabled=true;setStatus(state.previewMode?'预览模式运行中':'安静守护中',false);startAudioLoop();startScoreLoop();renderStats()}function startScoreLoop(){function tick(){if(!state.running)return;const now=Date.now(),delta=(now-state.lastTick)/1000;state.lastTick=now;if(state.volume<Number(elements.threshold.value)*.9){state.quietSeconds+=delta;state.currentQuietStreak+=delta;state.longestQuietStreak=Math.max(state.longestQuietStreak,state.currentQuietStreak);state.score+=(1+Math.min(8,Math.pow(state.currentQuietStreak/20,1.35)))*delta}if(state.endAt&&now>=state.endAt.getTime()){stopSession(true);return}renderStats();setTimeout(tick,500)}tick()}function stopSession(show=true){if(!state.running&&show)return;state.running=false;elements.startBtn.disabled=false;elements.stopBtn.disabled=true;elements.mode.disabled=false;state.endAt=null;state.overThresholdSince=null;if(state.animationFrame)cancelAnimationFrame(state.animationFrame);setStatus('已结束',false);updateVolumeUI(0);if(show)showResultModal()}function resetSessionData(ui=true){Object.assign(state,{score:0,quietSeconds:0,currentQuietStreak:0,longestQuietStreak:0,noiseEvents:0,volume:0,lastTick:null,endAt:null});if(ui)renderStats()}function resetAll(){if(state.scheduledTimer){clearTimeout(state.scheduledTimer);state.scheduledTimer=null}stopSession(false);resetSessionData(true);setStatus('等待开始',false);elements.startBtn.disabled=false;elements.stopBtn.disabled=true;elements.mode.disabled=false;updateVolumeUI(0)}function renderStats(){elements.score.textContent=Math.floor(state.score);elements.quietTime.textContent=formatSeconds(state.quietSeconds);elements.longestQuiet.textContent=formatSeconds(state.longestQuietStreak);elements.noiseEvents.textContent=state.noiseEvents;elements.timeLeft.textContent=state.endAt&&state.running?formatTime(Math.ceil((state.endAt-Date.now())/1000)):state.running?'手动模式':'--:--'}function getHonorTitle(s,n){if(s>=800&&n<=1)return'静音之神';if(s>=500)return'自习大师';if(s>=220)return'安静守护者';if(s>=80)return'安静小队';return'继续加油'}function showResultModal(){const s=Math.floor(state.score);elements.finalScore.textContent=s;elements.finalQuiet.textContent=formatSeconds(state.quietSeconds);elements.finalLongest.textContent=formatSeconds(state.longestQuietStreak);elements.finalNoise.textContent=state.noiseEvents;elements.titleBadge.textContent=getHonorTitle(s,state.noiseEvents);elements.resultModal.classList.add('show')}elements.mode.addEventListener('change',()=>{const m=elements.mode.value;elements.durationField.style.display=m==='duration'?'block':'none';elements.scheduleFields.style.display=m==='scheduled'?'block':'none'});elements.threshold.addEventListener('input',()=>elements.thresholdText.textContent=elements.threshold.value);elements.startBtn.addEventListener('click',()=>startSession());elements.stopBtn.addEventListener('click',()=>stopSession(true));elements.resetBtn.addEventListener('click',resetAll);elements.closeModalBtn.addEventListener('click',()=>{elements.resultModal.classList.remove('show');resetAll()});applyTimeTheme();setInterval(applyTimeTheme,1000);elements.mode.dispatchEvent(new Event('change'));renderStats();
  </script>
</body>
</html>
